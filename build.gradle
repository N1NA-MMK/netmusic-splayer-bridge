plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 国内镜像优先
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // Minecraft / Fabric（26.1 起 Fabric 直接使用 Mojang 官方映射，无需额外声明 mappings）
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 编译期依赖 NetMusic 本体（仅用于编译，运行时不打包、不分发）
    compileOnly "maven.modrinth:net-music:${project.netmusic_version}"

    // 开发环境（runServer/runClient）下需要把 NetMusic 及其前置装进来
    runtimeOnly "maven.modrinth:net-music:${project.netmusic_version}"
    runtimeOnly "maven.modrinth:forge-config-api-port:26.1.3-fabric"
    runtimeOnly "maven.modrinth:cloth-config:26.1.154+fabric"
}

loom {
    runs {
        server {
            runDir "run/server"
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
