plugins {
    // 版本不写在这里，由 settings.gradle 的 pluginManagement 按
    // active_mc_version 从 versions/<版本>.properties 的 loom_version 动态指定
    id 'fabric-loom'
}

def activeMcVersion = (project.findProperty('active_mc_version') ?: '26.1.2').toString()
def versionFile = rootProject.file("versions/${activeMcVersion}.properties")
if (!versionFile.exists()) {
    throw new GradleException("找不到版本配置文件 versions/${activeMcVersion}.properties，" +
            "可用版本见 versions/ 目录。当前 active_mc_version=${activeMcVersion}")
}

def versionProps = new Properties()
versionFile.withInputStream { stream -> versionProps.load(new InputStreamReader(stream, 'UTF-8')) }
versionProps.each { key, value -> project.ext.set(key.toString(), value.toString()) }

// 老版本需要关掉注解处理器（原因见下面 dependencies 块里的说明）
def disableAnnotationProcessing = versionProps.getProperty('mixin_ap', 'true') != 'true'


// ============================================================
// 多版本构建
//
// 同一个源码树编译到多个 MC 版本，版本参数放在 versions/<MC版本>.properties，
// 用 -Pactive_mc_version=1.21.1 切换（默认值见 gradle.properties）。
//
//   ./gradlew build                                # 构建默认版本（26.1.2）
//   ./gradlew build -Pactive_mc_version=1.21.1      # 构建其它版本
//   ./gradlew runServer -Pactive_mc_version=1.20.1  # 跑测试服务端
//
// 各版本真正的源码差异只有一处：NetMusic 的映射不同（26.1.2 是 Mojang 官方名，
// 1.21.1/1.20.1 是 Yarn 中转名），导致 NetMusicSound#tick 的方法名不同
// （tick vs method_16896）——由 generateMixinNames 按版本生成 MixinNames.java。
//
// 工具链也按版本走（版本文件里的 loom_version / gradle_version）：
//   26.1.2 → Loom 1.16-SNAPSHOT + Gradle 9.6.1
//   1.21.1 / 1.20.1 → Loom 1.9.2 + Gradle 8.12（老 Loom 才会同时处理
//                     fabric-api 的 intermediary 访问接口和官方映射）
// 换版本时 CI 会先按 gradle_version 重新生成 Gradle Wrapper。
// ============================================================

version = project.mod_version
group = project.maven_group

base {
    archivesName = "netmusic-splayer-bridge-mc${minecraft_version}"
}

repositories {
    // 国内镜像优先
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // Minecraft / Fabric（26.1 起 Fabric 直接使用 Mojang 官方映射，无需额外声明 mappings）
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.1 起 Loom 默认就是官方映射；老版本（1.21.1/1.20.1）必须显式声明，
    // 否则 Loom 走 Yarn，我们的源码用的是 Mojang 类名会编译不过
    if (versionProps.getProperty('mojang_mappings', 'true') == 'true') {
        mappings loom.officialMojangMappings()
    }
    // 注意：必须是 modImplementation，Loom 只把 sponge-mixin 等库挂到 mod 依赖上，
    // 用普通 implementation 会编译不过 Mixin 注解
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 编译期依赖 NetMusic 本体（仅用于编译，运行时不打包、不分发）
    compileOnly "maven.modrinth:net-music:${netmusic_version}"

    // 老版本关闭注解处理器（-proc:none）：MixinExtras 的注解处理器要解析目标类的
    // 继承链，而 NetMusic 在 1.20.1/1.21.1 上用 Yarn 编译，父类 class_1101 不在我们
    // Mojang 映射的编译类路径里，直接报 "Superclass ... was not found"。
    // 处理器是以 -processorpath 挂上的，exclude 配置拦不住，只能整颗关掉。
    // 我们的 mixin 全部 remap=false，本来就不需要它生成 refmap，关掉不影响运行。

    // 开发环境（runServer/runClient）下把 NetMusic 及其前置装进来
    dev_deps.split(',').each { coord ->
        runtimeOnly coord.trim()
    }
}

loom {
    runs {
        server {
            runDir "run/server-${minecraft_version}"
        }
    }
}

// ------------------------------------------------------------
// 生成 MixinNames：NetMusicSound#tick 在不同映射下的方法名不一样
// ------------------------------------------------------------
def mixinNamesDir = layout.buildDirectory.dir("generated/mixin-names")

sourceSets {
    main {
        java {
            srcDir mixinNamesDir
        }
    }
}

tasks.register('generateMixinNames') {
    group = 'build'
    description = '按当前 MC 版本生成 MixinNames（NetMusicSound#tick 的真实方法名）'
    outputs.dir mixinNamesDir
    inputs.property 'sound_tick_method', sound_tick_method
    doLast {
        def target = mixinNamesDir.get().asFile
                .toPath()
                .resolve("com/splayerbridge/netmusic/mixin/MixinNames.java")
                .toFile()
        target.parentFile.mkdirs()
        target.text = """package com.splayerbridge.netmusic.mixin;

/**
 * NetMusicSound 的 tick 方法在各 MC 版本下的真实名字，由构建脚本按版本生成，请勿手改。
 *
 * <p>Minecraft 26.1.2 的 NetMusic 用 Mojang 官方映射编译，方法名就是 {@code tick()}；
 * 1.21.1 / 1.20.1 的 NetMusic 用 Yarn 编译，方法名是中转映射下的 {@code method_16896()}。
 * Mixin 的 {@code method =} 必须是编译期常量，所以才用生成源码而不是读配置。
 */
public final class MixinNames {
    /** NetMusicSound 里负责推进歌词时钟的方法名。 */
    public static final String SOUND_TICK = "${sound_tick_method}";

    private MixinNames() {
    }
}
"""
    }
}

compileJava.dependsOn 'generateMixinNames'

processResources {
    inputs.property "version", project.version
    inputs.property "mc_constraint", mc_constraint
    inputs.property "java_constraint", java_constraint
    inputs.property "loader_constraint", loader_constraint

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mc_constraint": mc_constraint,
                "java_constraint": java_constraint,
                "loader_constraint": loader_constraint
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(java_release.toString())
    it.options.encoding = "UTF-8"
    if (disableAnnotationProcessing) {
        it.options.compilerArgs.add '-proc:none'
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(java_release.toString())
    targetCompatibility = JavaVersion.toVersion(java_release.toString())
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
