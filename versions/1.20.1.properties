# Minecraft 1.20.1
# NetMusic 该版本用 Yarn 编译，NetMusicSound 的 tick 方法在中转映射下叫 method_16896
loom_version=1.9.2
gradle_version=8.12
minecraft_version=1.20.1
loader_version=0.16.10
fabric_version=0.92.12+1.20.1
netmusic_version=LJKPLnDE
java_release=17
mc_constraint=~1.20.1
java_constraint=>=17
loader_constraint=>=0.16.5
mojang_mappings=true
sound_tick_method=method_16896

# 开发环境（runServer/runClient）额外要装的模组，逗号分隔
# 是否启用 Mixin 编译期校验（注解处理器）
# 老版本的 NetMusic 用 Yarn 编译，父类 class_1101 不在 Mojang 映射类路径上，
# 处理器解析继承链会直接报错；我们的 mixin 都是 remap=false，不需要它生成 refmap
mixin_ap=false

dev_deps=maven.modrinth:net-music:LJKPLnDE,maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric,maven.modrinth:cloth-config:11.1.136+fabric
