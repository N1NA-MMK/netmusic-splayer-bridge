# Minecraft 26.1.2（默认）
# NetMusic 该版本用 Mojang 官方映射编译，NetMusicSound#tick 就叫 tick()
minecraft_version=26.1.2
loader_version=0.20.0
fabric_version=0.155.0+26.1.2
netmusic_version=2OYIgkiY
java_release=25
mc_constraint=~26.1.2
java_constraint=>=25
loader_constraint=>=0.19.2
sound_tick_method=tick
# 是否显式声明使用 Mojang 官方映射（26.1 起 Loom 默认就是，老版本必须显式声明）
mojang_mappings=true

# 开发环境（runServer/runClient）额外要装的模组，逗号分隔
dev_deps=maven.modrinth:net-music:2OYIgkiY,maven.modrinth:forge-config-api-port:26.1.3-fabric,maven.modrinth:cloth-config:26.1.154+fabric
