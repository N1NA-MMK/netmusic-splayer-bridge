# Minecraft 26.1.2（默认）
# NetMusic 该版本用 Mojang 官方映射编译，NetMusicSound#tick 就叫 tick()
# 插件 id：Loom 1.16 起两个 id 是不同的插件类——
#   fabric-loom              → LoomGradlePlugin（经典版，要求填 mappings 配置）
#   net.fabricmc.fabric-loom → LoomNoRemapGradlePlugin（官方映射世界，不读 mappings）
# 26.1.2 是官方映射所以用后者，老版本要走 mappings 所以用前者。
loom_plugin_id=net.fabricmc.fabric-loom
loom_version=1.16-SNAPSHOT
gradle_version=9.6.1
minecraft_version=26.1.2
loader_version=0.20.0
fabric_version=0.155.0+26.1.2
netmusic_version=2OYIgkiY
java_release=25
mc_constraint=~26.1.2
java_constraint=>=25
loader_constraint=>=0.19.2
# 26.1 把权限系统换成了 PermissionSet/Permission，hasPermission(int) 没了
new_permission_api=true

sound_tick_method=tick
mojang_mappings=false

# 开发环境（runServer/runClient）额外要装的模组，逗号分隔
# 是否启用 Mixin 编译期校验（注解处理器）
# 老版本的 NetMusic 用 Yarn 编译，父类 class_1101 不在 Mojang 映射类路径上，
# 处理器解析继承链会直接报错；我们的 mixin 都是 remap=false，不需要它生成 refmap
# 依赖声明用 modImplementation 还是 implementation：
# LoomNoRemapGradlePlugin（26.1.2 官方映射）不创建 mod 配置，只能用后者；
# LoomGradlePlugin（老版本）必须用前者，否则拿不到 sponge-mixin，Mixin 注解编译不过
use_mod_implementation=false

mixin_ap=true

dev_deps=maven.modrinth:net-music:2OYIgkiY,maven.modrinth:forge-config-api-port:26.1.3-fabric,maven.modrinth:cloth-config:26.1.154+fabric
