# Minecraft 1.21.1
# NetMusic 该版本用 Yarn 编译，NetMusicSound 的 tick 方法在中转映射下叫 method_16896
# 插件 id：Loom 1.16 起两个 id 是不同的插件类——
#   fabric-loom              → LoomGradlePlugin（经典版，要求填 mappings 配置）
#   net.fabricmc.fabric-loom → LoomNoRemapGradlePlugin（官方映射世界，不读 mappings）
# 26.1.2 是官方映射所以用后者，老版本要走 mappings 所以用前者。
loom_plugin_id=fabric-loom
loom_version=1.9.2
gradle_version=8.12
minecraft_version=1.21.1
loader_version=0.17.2
fabric_version=0.116.17+1.21.1
netmusic_version=R4Xmu04j
java_release=21
mc_constraint=~1.21
java_constraint=>=21
loader_constraint=>=0.16.9
mojang_mappings=true
# 26.1 把权限系统换成了 PermissionSet/Permission，hasPermission(int) 没了
new_permission_api=false

sound_tick_method=method_16896

# 开发环境（runServer/runClient）额外要装的模组，逗号分隔
# 是否启用 Mixin 编译期校验（注解处理器）
# 老版本的 NetMusic 用 Yarn 编译，父类 class_1101 不在 Mojang 映射类路径上，
# 处理器解析继承链会直接报错；我们的 mixin 都是 remap=false，不需要它生成 refmap
# 依赖声明用 modImplementation 还是 implementation：
# LoomNoRemapGradlePlugin（26.1.2 官方映射）不创建 mod 配置，只能用后者；
# LoomGradlePlugin（老版本）必须用前者，否则拿不到 sponge-mixin，Mixin 注解编译不过
use_mod_implementation=true

mixin_ap=false

dev_deps=maven.modrinth:net-music:R4Xmu04j,maven.modrinth:forge-config-api-port:v21.1.6-1.21.1-Fabric,maven.modrinth:cloth-config:15.0.140+fabric
