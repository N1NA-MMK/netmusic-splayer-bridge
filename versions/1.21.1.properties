# Minecraft 1.21.1
# NetMusic 该版本用 Yarn 编译，NetMusicSound 的 tick 方法在中转映射下叫 method_16896
minecraft_version=1.21.1
loader_version=0.17.2
fabric_version=0.116.17+1.21.1
netmusic_version=R4Xmu04j
java_release=21
mc_constraint=~1.21
java_constraint=>=21
loader_constraint=>=0.16.9
sound_tick_method=method_16896
# 工具链标记：legacy 需要 Loom ≤1.13 + Gradle 8 + Yarn 映射，
# 现代 Loom 无法编译该版本（fabric-api 的访问接口是 intermediary 命名空间）
toolchain=legacy

# 开发环境（runServer/runClient）额外要装的模组，逗号分隔
dev_deps=maven.modrinth:net-music:R4Xmu04j,maven.modrinth:forge-config-api-port:v21.1.6-1.21.1-Fabric,maven.modrinth:cloth-config:15.0.140+fabric
