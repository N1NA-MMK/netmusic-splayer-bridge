name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.3.1'
        required: true
        default: '1.3.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.1.2', java: '25' }
          - { mc: '1.21.1', java: '21' }
          - { mc: '1.20.1', java: '21' }

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'

      # 该 MC 版本需要的 Gradle 版本，见 versions/<MC>.properties
      - name: Use the Gradle version for MC ${{ matrix.mc }}
        run: |
          GRADLE_VERSION=$(grep '^gradle_version=' "versions/${{ matrix.mc }}.properties" | cut -d= -f2)
          echo "MC ${{ matrix.mc }} → Gradle $GRADLE_VERSION, JDK ${{ matrix.java }}"
          sed -i "s|gradle-[0-9.]*-bin.zip|gradle-${GRADLE_VERSION}-bin.zip|" gradle/wrapper/gradle-wrapper.properties

      - name: Build
        run: ./gradlew build -Pactive_mc_version=${{ matrix.mc }} -Pmod_version="$VERSION" --no-daemon --stacktrace

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: build/libs/*.jar
