name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.4.0'
        required: true
        default: '1.4.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.1.2', java: '25' }
          - { mc: '1.21.1', java: '21' }
          - { mc: '1.20.1', java: '21' }

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'

      # 仓库不提交 gradlew，用 setup-gradle 提供；版本按 MC 版本取
      - name: Read Gradle version for MC ${{ matrix.mc }}
        id: toolchain
        run: |
          GRADLE_VERSION=$(grep '^gradle_version=' "versions/${{ matrix.mc }}.properties" | cut -d= -f2)
          echo "MC ${{ matrix.mc }} → Gradle $GRADLE_VERSION, JDK ${{ matrix.java }}"
          echo "gradle=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle ${{ steps.toolchain.outputs.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      - name: Build
        run: gradle build -Pactive_mc_version=${{ matrix.mc }} -Pmod_version="$VERSION" --no-daemon --stacktrace

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: build/libs/*.jar
