name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MC 版本 → 配对的 JDK；Gradle 版本从 versions/<MC>.properties 读
          - { mc: '26.1.2', java: '25' }
          - { mc: '1.21.1', java: '21' }
          - { mc: '1.20.1', java: '21' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'

      # 仓库里不提交 gradlew（见 .gitignore），所以用 setup-gradle 提供 Gradle，
      # 版本按 MC 版本从 versions/<MC>.properties 取：26.1.2 要 9.x，
      # 1.21.1 / 1.20.1 要 8.12（配 Loom 1.9.2）。
      - name: Read Gradle version for MC ${{ matrix.mc }}
        id: toolchain
        run: |
          GRADLE_VERSION=$(grep '^gradle_version=' "versions/${{ matrix.mc }}.properties" | cut -d= -f2)
          echo "MC ${{ matrix.mc }} → Gradle $GRADLE_VERSION, JDK ${{ matrix.java }}"
          echo "gradle=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle ${{ steps.toolchain.outputs.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      - name: Build
        run: gradle build -Pactive_mc_version=${{ matrix.mc }} --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
